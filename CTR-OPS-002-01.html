<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 관제 포털 - 스마트 안심 돌봄</title>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Poppins & Pretendard) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="layout.css" rel="stylesheet">
    <link href="content.css" rel="stylesheet">
    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- 사이드바 영역 -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">안</div>
            <div class="brand-text">
                <div class="title">안심 돌봄 서비스 운영시스템</div>
                <div class="subtitle">관제 포털</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group">
                <div class="nav-item parent-item">
                    <div class="nav-left">
                        <span class="icon-box-blank"><i class="fa-solid fa-chart-pie"></i></span>
                        <span class="nav-label">현황</span>
                    </div>
                </div>
            </div>
            <div class="nav-group active"><div class="nav-item parent-item"><div class="nav-left"><span class="icon-box"><i class="fa-solid fa-gears"></i></span><span class="nav-label">운영</span></div></div></div>
            <div class="nav-group"><div class="nav-item parent-item"><div class="nav-left"><span class="icon-box-blank"><i class="fa-solid fa-heart-pulse"></i></span><span class="nav-label">안부 확인</span></div></div></div>
            <div class="nav-group"><div class="nav-item parent-item"><div class="nav-left"><span class="icon-box-blank"><i class="fa-solid fa-user-group"></i></span><span class="nav-label">사용자</span></div></div></div>
            <div class="nav-group"><div class="nav-item parent-item"><div class="nav-left"><span class="icon-box-blank"><i class="fa-solid fa-clock"></i></span><span class="nav-label">디바이스</span></div></div></div>
            <div class="nav-group"><div class="nav-item parent-item"><div class="nav-left"><span class="icon-box-blank"><i class="fa-solid fa-handshake"></i></span><span class="nav-label">서비스</span></div></div></div>
            <div class="nav-group"><div class="nav-item parent-item"><div class="nav-left"><span class="icon-box-blank"><i class="fa-solid fa-chart-column"></i></span><span class="nav-label">로그·통계</span></div></div></div>
            <div class="nav-group"><div class="nav-item parent-item"><div class="nav-left"><span class="icon-box-blank"><i class="fa-solid fa-screwdriver-wrench"></i></span><span class="nav-label">시스템</span></div></div></div>
        </nav>

        <div class="sidebar-footer">
            <div class="user-profile-card">
                <div class="user-avatar">
                    <img src="https://i.pravatar.cc/100?img=20" alt="사용자 프로필">
                </div>
                <div class="user-info">
                    <div class="user-name">박수현 <span class="role-tag">상담원</span></div>
                    <div class="user-role">관제2팀 근무 중</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- 메인 컨테이너 -->
    <div class="container">

        <!-- 상단 헤더 -->
        <div class="top-header">
            <div class="header-welcome-text">
                <i class="fa-regular fa-hand-wave"></i> 오늘도 안전한 관제를 시작하세요!
            </div>
            <div class="header-right">
                <div class="user-status-info">
                    <span class="user-title">ITeyes 관리자 홍길동 님</span>
                    <span class="user-meta">(최근 접속 2026-10-05 17:42)</span>
                    <button type="button" class="logout-btn">로그아웃</button>
                </div>
                <div class="user-avatar-btn">
                    <img src="https://i.pravatar.cc/100?img=20" alt="User Avatar">
                </div>
            </div>
        </div>

        <!-- 페이지 타이틀 바 -->
        <div class="page-title-bar">
            <div class="page-title-left">
                <h2 class="page-main-title">도움 제공 연락명부</h2>
                <span class="page-sub-desc"></span>
            </div>
            <div class="breadcrumb">
                <span>운영</span> <i class="fa-solid fa-chevron-right"></i> <span class="active">도움 제공 연락명부</span>
            </div>
        </div>
        
        <!-- 컨텐츠 시작 영역 -->
        <div class="content-body">
            <div class="content-inner-box">
         
                <!-- 탐지 정보 요약 타이틀 -->
                <div class="section-caption">
                    <div class="caption-group">
                        <i class="fa-solid fa-grip-vertical title-icon"></i>
                        <span>사람 등록</span>
                    </div>
                </div>

                <!-- 상세 정보 테이블 -->
                <table class="detail-table">
                    <colgroup>
                        <col style="width: 15%;">
                        <col style="width: 35%;">
                        <col style="width: 15%;">
                        <col style="width: 35%;">
                    </colgroup>
                    <tbody>
                        <tr>
                            <th>상태</th>
                            <td>사용 중</td>
                            <th>등록</th>
                            <td>김담당 2026-05-20</td>
                        </tr>
                        <tr>
                            <th>이름 <span class="required">*</span></th>
                            <td>
                                <input type="text" class="form-input" value="박주무" placeholder="이름을 입력하세요.">
                            </td>
                            <th>전화번호 <span class="required">*</span></th>
                            <td>
                                <input type="text" class="form-input" value="031-000-1234" placeholder="전화번호를 입력하세요.">
                            </td>
                        </tr>
                        <tr>
                            <th>소속</th>
                            <td colspan="3">
                                <input type="text" class="form-input" value="가동 행정복지센터" placeholder="소속을 입력하세요.">
                            </td>
                        </tr>
                        <tr>
                            <th>도움 유형 <span class="required">*</span></th>
                            <td colspan="3">
                                <div class="checkbox-group-inline">
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="help-type" value="visit" checked> 방문 확인
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="help-type" value="face"> 대면 안부
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="help-type" value="reeducation"> 사용법 재교육
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="help-type" value="inspection"> 기기 점검
                                    </label>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <th>맡는 읍면동 <span class="required">*</span></th>
                            <td colspan="3">
                                <div class="checkbox-group-inline">
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="region-type" value="all"> 전체
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="region-type" value="ga" checked> 가동
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="region-type" value="na"> 나동
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="region-type" value="dam"> 다면
                                    </label>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <th>연락 가능 시간</th>
                            <td colspan="3">
                                <input type="text" class="form-input" value="평일 09:00~18:00" placeholder="연락 가능 시간을 입력하세요.">
                            </td>
                        </tr>
                        <tr>
                            <th>메모</th>
                            <td colspan="3">
                                <textarea class="modal-form-textarea" placeholder="메모를 입력하세요." style="width: 100%; min-height: 80px;">가동 담당 주무관. 점심시간에는 대표번호로</textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>

                

                <!-- 게시판 하단 버튼 영역 -->
                <div class="board-actions">
                    <button type="button" class="btn-outline btn-type-01 btn-lg">목록</button>
                    
                    <div class="btn-group-right">
                        <button type="button" class="btn-default btn-type-01 btn-lg">저장</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
