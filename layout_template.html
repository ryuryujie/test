<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 관제 포털 - 스마트 안심 돌봄</title>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Poppins & Pretendard) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @charset "UTF-8";

        :root {
            /* lezato 스타일 트렌디 컬러 팔레트 */
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --border-color: #f1f5f9;
            --border-subtle: #e2e8f0;
            
            /* 레트로 오렌지 / 앰버 포인트 */
            --primary-orange: #ff6b4a;
            --primary-light: #fff2ef;
            --primary-hover: #e05536;
            
            /* 텍스트 컬러 */
            --text-main: #1e293b;
            --text-sub: #64748b;
            --text-muted: #94a3b8;
            
            /* 섀도우 시스템 */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(149, 157, 165, 0.08);
            --shadow-orange: 0 8px 16px rgba(255, 107, 74, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* ---------------- 사이드바 스타일 ---------------- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 24px 18px;
            flex-shrink: 0;
            z-index: 100;
        }

        /* 브랜드 영역 */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding: 0 8px;
        }

        /* 기존 오렌지 박스 스타일에 아이콘 대신 텍스트 "화" 입력 */
        .brand-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #ff8c73 0%, var(--primary-orange) 100%);
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            box-shadow: var(--shadow-orange);
            flex-shrink: 0;
        }

        .brand-text .title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .brand-text .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* 네비게이션 메인 */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-sub);
        }

        .nav-item:hover {
            background-color: #f8fafc;
            color: var(--text-main);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 14px;
        }

        /* 오렌지 원형 아이콘 박스 */
        .icon-box {
            width: 32px;
            height: 32px;
            background-color: var(--primary-orange);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(255, 107, 74, 0.3);
        }

        .icon-box-blank {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: var(--text-muted);
        }

        /* 활성화된 메뉴 그룹 스타일 */
        .nav-group.active > .nav-item {
            background-color: var(--primary-light);
            color: var(--primary-orange);
            font-weight: 600;
        }

        /* 서브메뉴 (뎁스 표현) */
        .sub-menu {
            list-style: none;
            padding-left: 44px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sub-item a {
            text-decoration: none;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 6px;
            transition: color 0.2s;
        }

        .sub-item a:hover {
            color: var(--text-main);
        }

        .sub-item.active a {
            color: var(--primary-orange);
            font-weight: 600;
        }

        .sub-item .badge {
            background-color: #fee2e2;
            color: #ef4444;
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* 사이드바 하단 프로필 */
        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .user-profile-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 12px;
            background-color: #f8fafc;
        }

        .user-avatar img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .role-tag {
            font-size: 10px;
            background-color: var(--primary-light);
            color: var(--primary-orange);
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 4px;
        }

        .user-role {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ---------------- 메인 영역 ---------------- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
            gap: 18px;
            overflow-y: auto;
        }

        /* 상단 탑바 (Header) */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-sub);
            cursor: pointer;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 380px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 20px;
            border-radius: 24px;
            border: 1px solid transparent;
            background-color: #fff;
            font-size: 13px;
            box-shadow: var(--shadow-sm);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 74, 0.15);
        }

        .search-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-badge-btn {
            position: relative;
            width: 38px;
            height: 38px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-sub);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }

        .badge-count {
            position: absolute;
            top: -2px;
            right: -2px;
            background-color: var(--primary-orange);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }

        .user-avatar-btn img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 배너 & 타이틀 영역 */
        .alert-banner {
            background-color: #fff;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--primary-orange);
        }

        .alert-icon {
            color: var(--primary-orange);
            font-size: 14px;
        }

        .page-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 4px;
        }

        .page-title-left {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .page-main-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .page-sub-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .breadcrumb {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb .active {
            color: var(--primary-orange);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- 사이드바 영역 -->
    <aside class="sidebar">
        <!-- 브랜드 로고 -->
        <div class="brand">
            <div class="brand-logo">화</div>
            <div class="brand-text">
                <div class="title">화순군 안심 돌봄</div>
                <div class="subtitle">스마트 관제 포털</div>
            </div>
        </div>

        <!-- 네비게이션 메뉴 -->
        <nav class="sidebar-nav">
            <!-- 활성화된 메인 카테고리 -->
            <div class="nav-group active">
                <div class="nav-item parent-item">
                    <div class="nav-left">
                        <span class="icon-box"><i class="fa-solid fa-shapes"></i></span>
                        <span class="nav-label">운영 현황</span>
                    </div>
                </div>
                <ul class="sub-menu">
                    <li class="sub-item active"><a href="#">메인 대시보드</a></li>
                    <li class="sub-item"><a href="#">실시간 모니터링</a></li>
                </ul>
            </div>

            <!-- 사건 관리 -->
            <div class="nav-group">
                <div class="nav-item parent-item">
                    <div class="nav-left">
                        <span class="icon-box-blank"><i class="fa-solid fa-triangle-exclamation"></i></span>
                        <span class="nav-label">사건 관리</span>
                    </div>
                </div>
                <ul class="sub-menu">
                    <li class="sub-item"><a href="#">진행 중 사건 <span class="badge">12</span></a></li>
                    <li class="sub-item"><a href="#">처리 이력</a></li>
                </ul>
            </div>

            <!-- 대상자 관리 -->
            <div class="nav-group">
                <div class="nav-item parent-item">
                    <div class="nav-left">
                        <span class="icon-box-blank"><i class="fa-solid fa-user-group"></i></span>
                        <span class="nav-label">대상자 관리</span>
                    </div>
                </div>
                <ul class="sub-menu">
                    <li class="sub-item"><a href="#">대상자 조회</a></li>
                    <li class="sub-item"><a href="#">착용 현황</a></li>
                </ul>
            </div>

            <!-- 통계 및 보고 -->
            <div class="nav-group">
                <div class="nav-item parent-item">
                    <div class="nav-left">
                        <span class="icon-box-blank"><i class="fa-solid fa-chart-column"></i></span>
                        <span class="nav-label">통계 및 보고</span>
                    </div>
                </div>
                <ul class="sub-menu">
                    <li class="sub-item"><a href="#">지역과 연령</a></li>
                    <li class="sub-item"><a href="#">운영 리포트</a></li>
                </ul>
            </div>
        </nav>

        <!-- 사이드바 하단 프로필 -->
        <div class="sidebar-footer">
            <!-- 프로필 카드 -->
            <div class="user-profile-card">
                <div class="user-avatar">
                    <img src="https://i.pravatar.cc/100?img=20" alt="사용자 프로필">
                </div>
                <div class="user-info">
                    <div class="user-name">박수현 <span class="role-tag">상담원</span></div>
                    <div class="user-role">관제2팀 근무 중</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- 메인 컨테이너 -->
    <div class="main-container">

        <!-- 상단 헤더 / 탑바 -->
        <header class="top-header">
            <div class="header-left">
                <button class="menu-toggle-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="search-box">
                    <input type="text" placeholder="어르신 이름, 대상자 코드, 연락처 검색...">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>

            <div class="header-right">
                <div class="icon-badge-btn">
                    <i class="fa-regular fa-bell"></i>
                    <span class="badge-count">12</span>
                </div>

                <div class="user-avatar-btn">
                    <img src="https://i.pravatar.cc/100?img=20" alt="User Avatar">
                </div>
            </div>
        </header>

        <!-- 공지 및 안내 띠 배너 -->
        <div class="alert-banner">
            <i class="fa-solid fa-shield-halved alert-icon"></i>
            <span><strong>[보안 공지]</strong> 목적 외 개인정보 조회를 엄격히 금하며, 자리 비움 시 화면을 반드시 잠가 주십시오.</span>
        </div>

        <!-- 페이지 타이틀 바 -->
        <div class="page-title-bar">
            <div class="page-title-left">
                <h2 class="page-main-title">진행 중 사건</h2>
                <span class="page-sub-desc">실시간 이상 신호 및 응급 상황 대응</span>
            </div>
            <div class="breadcrumb">
                <span>사건 관리</span> <i class="fa-solid fa-chevron-right"></i> <span class="active">진행 중 사건</span>
            </div>
        </div>

        
        <!-- 실제 컨텐츠 시작 영역 -->
        <div class="content-body">
        </div>
    </div>

</body>
</html>
