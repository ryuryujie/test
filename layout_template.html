<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 관제 포털 - 레이아웃 템플릿</title>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 공통 레이아웃 및 컨텐츠 CSS 링크 -->
    <link rel="stylesheet" href="layout.css">
</head>
<body>

    <!-- 사이드바 영역 (레이아웃) -->
    <div class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-logo">안</div>
                <div class="brand-text">
                    <div class="title">화순군 안부살핌</div>
                    <div class="subtitle">스마트 관제 포털</div>
                </div>
            </div>

            <a class="menu-item active">
                <span><i class="fa-solid fa-shapes"></i> 운영 현황</span>
            </a>

            <div class="menu-category">사건 관리</div>
            <a class="menu-item">
                <span><i class="fa-solid fa-triangle-exclamation"></i> 진행 중 사건</span>
            </a>
            <a class="menu-item">
                <span><i class="fa-solid fa-clock-rotate-left"></i> 처리 이력</span>
            </a>

            <div class="menu-category">대상자 관리</div>
            <a class="menu-item">
                <span><i class="fa-solid fa-user-group"></i> 대상자 조회</span>
            </a>
            <a class="menu-item">
                <span><i class="fa-solid fa-clock"></i> 착용 현황</span>
            </a>

            <div class="menu-category">통계 및 보고</div>
            <a class="menu-item">
                <span><i class="fa-solid fa-chart-column"></i> 지역과 연령</span>
            </a>
            <a class="menu-item">
                <span><i class="fa-solid fa-file-lines"></i> 운영 리포트</span>
            </a>
        </div>

        <div class="user-profile">
            <div class="user-avatar">상담</div>
            <div class="user-info">
                <div class="user-name">박수현 상담원</div>
                <div class="user-role">관제2팀 (교대 근무)</div>
            </div>
            <i class="fa-solid fa-shield-halved shield-icon"></i>
        </div>
    </div>

    <!-- 메인 컨테이너 (레이아웃) -->
    <div class="main-container">

        test
        
    </div>


</body>
</html>
